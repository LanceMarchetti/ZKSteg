<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hide Text In Any Comment</title>
  <style>
    :root {
      --bg-dark: #0f0f11;
      --card-bg: #18181c;
      --border-color: #2e2e38;
      --accent-embed: #f59e0b;
      --accent-embed-hover: #d97706;
      --accent-extract: #6afd9c;
      --accent-extract-hover: #52e082;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .header h1 {
      font-size: 1.6rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #matrixCanvas {
      width: 32px;
      height: 32px;
      background: #000;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* Tab Switcher Navigation */
    .tab-nav {
      display: flex;
      background: #111115;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 22px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active[data-tab="embed"] {
      background: var(--card-bg);
      color: var(--accent-embed);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .tab-btn.active[data-tab="extract"] {
      background: var(--card-bg);
      color: var(--accent-extract);
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      transition: color 0.2s;
    }

    .active-embed label {
      color: var(--accent-embed);
    }

    .active-extract label {
      color: var(--accent-extract);
    }

    .sub-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      float: right;
      font-weight: normal;
      text-transform: none;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .active-embed input[type="text"]:focus, 
    .active-embed textarea:focus {
      border-color: var(--accent-embed);
    }

    .active-extract input[type="text"]:focus, 
    .active-extract textarea:focus {
      border-color: var(--accent-extract);
      box-shadow: 0 0 6px rgba(106, 253, 156, 0.2);
    }

    textarea.revealed {
      color: var(--accent-extract) !important;
      border-color: var(--accent-extract) !important;
      box-shadow: 0 0 12px rgba(106, 253, 156, 0.3);
      font-weight: 600;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .preset-buttons {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #25252e;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .preset-btn:hover {
      border-color: var(--accent-embed);
      color: var(--text-main);
    }

    button.action-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin: 10px 0 20px 0;
      transition: background-color 0.2s;
    }

    .btn-embed-action {
      background: var(--accent-embed);
      color: #000;
    }

    .btn-embed-action:hover {
      background: var(--accent-embed-hover);
    }

    .btn-extract-action {
      background: var(--accent-extract);
      color: #000;
    }

    .btn-extract-action:hover {
      background: var(--accent-extract-hover);
    }

    .copy-btn {
      position: absolute;
      right: 8px;
      top: 32px;
      background: #272730;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .copy-btn:hover {
      border-color: var(--accent-embed);
    }

    .byte-inspector {
      margin-top: 12px;
      background: #121215;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #888;
      max-height: 80px;
      overflow-y: auto;
      word-break: break-all;
    }

    .status {
      font-size: 0.8rem;
      margin-top: 8px;
      display: none;
    }

    .status.embed-status { color: var(--accent-green); }
    .status.extract-status { color: var(--accent-extract); }
    .status.error { color: #ef4444 !important; }
  </style>
</head>
<body>

<div class="container active-embed" id="appContainer">
  <div class="header">
    <div class="header-title-wrap">
      <canvas id="matrixCanvas"></canvas>
      <h1>Hide Text In Any Comment</h1>
    </div>
    <p>Client-side zero-width steganography with PRNG bit-scrambling</p>
  </div>

  <!-- Navigation Tabs -->
  <div class="tab-nav">
    <button class="tab-btn active" data-tab="embed" onclick="switchTab('embed')">🔒 Embed Message</button>
    <button class="tab-btn" data-tab="extract" onclick="switchTab('extract')">🔓 Extract Message</button>
  </div>

  <!-- TAB 1: EMBED VIEW -->
  <div id="embedTab" class="tab-content active">
    <div class="form-group">
      <label>Secret Passphrase <span class="sub-label">Seeds PRNG bit shuffle & cipher</span></label>
      <input type="text" id="embedPassphrase" placeholder="Enter key (e.g. passphrase)">
    </div>

    <div class="form-group">
      <label>Secret Payload <span class="sub-label">Text to hide</span></label>
      <textarea id="embedSecretText" placeholder="Type your secret message here..."></textarea>
    </div>

    <div class="form-group">
      <label>Cover Text (Organic Comment) <span class="sub-label">Visible text posted online</span></label>
      <textarea id="embedCoverText" placeholder="Type a natural comment relevant to the video topic..."></textarea>
      <div class="preset-buttons">
        <button class="preset-btn" onclick="setCover('Red Screen')">Red Screen Preset</button>
        <button class="preset-btn" onclick="setCover('Music')">Music Preset</button>
        <button class="preset-btn" onclick="setCover('Generic')">Generic Preset</button>
      </div>
    </div>

    <button class="action-btn btn-embed-action" onclick="handleEncode()">🔒 Scramble & Embed</button>

    <div class="form-group">
      <label>Output Result <span class="sub-label" id="embedCharStats">0 chars</span></label>
      <button class="copy-btn" onclick="copyOutput('embedOutputResult')">📋 Copy</button>
      <textarea id="embedOutputResult" readonly placeholder="Encoded output will appear here..."></textarea>
      <div id="embedStatus" class="status embed-status"></div>
    </div>
  </div>

  <!-- TAB 2: EXTRACT VIEW -->
  <div id="extractTab" class="tab-content">
    <div class="form-group">
      <label>Secret Passphrase <span class="sub-label">Passphrase used to encrypt</span></label>
      <input type="text" id="extractPassphrase" placeholder="Enter key (e.g. passphrase)">
    </div>

    <div class="form-group">
      <label>Comment Input <span class="sub-label">Paste the comment containing hidden bytes</span></label>
      <textarea id="extractInputText" placeholder="Paste the comment here..."></textarea>
    </div>

    <button class="action-btn btn-extract-action" onclick="handleDecode()">🔓 Extract & Unscramble</button>

    <div class="form-group">
      <label>Uncovered Secret <span class="sub-label">Revealed payload outcome</span></label>
      <textarea id="extractSecretText" readonly placeholder="Decrypted secret will appear here..."></textarea>
      <div id="extractStatus" class="status extract-status"></div>
    </div>
  </div>

  <!-- Byte Inspector (Shared) -->
  <div class="form-group">
    <label>Byte Inspector <span class="sub-label">Raw UTF-8 Embedded Sequences</span></label>
    <div id="byteInspector" class="byte-inspector">No hidden sequence detected.</div>
  </div>
</div>

<script>
  // Matrix Logo Animation
  (function initMatrixLogo() {
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 32;
    canvas.height = 32;

    const chars = '0123456789ABCDEF';
    const drops = [0, 0];

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#6afd9c';
      ctx.font = '10px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * 16 + 2, drops[i] * 12 + 10);
        if (drops[i] * 12 > canvas.height && Math.random() > 0.8) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 80);
  })();

  const ZW_ZERO = '\u200B';
  const ZW_ONE  = '\u200C';
  const ZW_MARK = '\u200D';

  const presets = {
    'Red Screen': 'This red light ambient track is really relaxing to keep on in the background.',
    'Music': 'Loved the production on this track! The guitar tone is absolutely sublime.',
    'Generic': 'Great video, thanks for sharing this helpful content. I am sure it will prove useful to many out there who find it hard to keep up lately.'
  };

  function setCover(key) {
    document.getElementById('embedCoverText').value = presets[key];
  }

  function switchTab(tabName) {
    const container = document.getElementById('appContainer');
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-content').forEach(content => {
      content.classList.remove('active');
    });

    if (tabName === 'embed') {
      container.classList.add('active-embed');
      container.classList.remove('active-extract');
      document.getElementById('embedTab').classList.add('active');
    } else {
      container.classList.add('active-extract');
      container.classList.remove('active-embed');
      document.getElementById('extractTab').classList.add('active');
    }
  }

  // PRNG & Cipher Logic
  function createPRNG(seedString) {
    let h = 2166136261;
    for (let i = 0; i < seedString.length; i++) {
      h = Math.imul(h ^ seedString.charCodeAt(i), 16777619);
    }
    return function() {
      h += 0x6D2B79F5;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function getPermutationIndices(length, seedString) {
    const prng = createPRNG(seedString);
    const indices = Array.from({ length }, (_, i) => i);
    for (let i = length - 1; i > 0; i--) {
      const j = Math.floor(prng() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  }

  function scrambleBits(bits, seedString) {
    const indices = getPermutationIndices(bits.length, seedString);
    const scrambled = new Array(bits.length);
    for (let i = 0; i < bits.length; i++) {
      scrambled[indices[i]] = bits[i];
    }
    return scrambled;
  }

  function unscrambleBits(scrambledBits, seedString) {
    const indices = getPermutationIndices(scrambledBits.length, seedString);
    const original = new Array(scrambledBits.length);
    for (let i = 0; i < scrambledBits.length; i++) {
      original[i] = scrambledBits[indices[i]];
    }
    return original;
  }

  function xorCipher(text, key) {
    if (!key) return text;
    let result = '';
    for (let i = 0; i < text.length; i++) {
      result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return result;
  }

  function textToBinary(text) {
    return text.split('').map(char => char.charCodeAt(0).toString(2).padStart(8, '0')).join('');
  }

  function binaryToText(binary) {
    const bytes = binary.match(/.{1,8}/g) || [];
    return bytes.map(byte => String.fromCharCode(parseInt(byte, 2))).join('');
  }

  function handleEncode() {
    const secret = document.getElementById('embedSecretText').value;
    const cover = document.getElementById('embedCoverText').value;
    const key = document.getElementById('embedPassphrase').value;

    if (!secret) return showStatus('embedStatus', 'Please enter a secret payload to hide.', true);
    if (!cover) return showStatus('embedStatus', 'Please enter cover text.', true);
    if (!key) return showStatus('embedStatus', 'Please enter a passphrase to seed the PRNG.', true);

    const encrypted = xorCipher(secret, key);
    const rawBits = textToBinary(encrypted).split('');
    const scrambledBits = scrambleBits(rawBits, key);

    let zwPayload = ZW_MARK;
    for (const bit of scrambledBits) {
      zwPayload += (bit === '0' ? ZW_ZERO : ZW_ONE);
    }
    zwPayload += ZW_MARK;

    const firstChar = cover.charAt(0);
    const remainingCover = cover.slice(1);
    const finalOutput = firstChar + zwPayload + remainingCover;

    document.getElementById('embedOutputResult').value = finalOutput;
    updateInspector(finalOutput);
    showStatus('embedStatus', 'Payload encrypted, scrambled, and embedded after character 1!');
  }

  function handleDecode() {
    const secretEl = document.getElementById('extractSecretText');
    secretEl.classList.remove('revealed');

    const input = document.getElementById('extractInputText').value;
    const key = document.getElementById('extractPassphrase').value;

    if (!input) return showStatus('extractStatus', 'Please paste a comment to decode.', true);
    if (!key) return showStatus('extractStatus', 'Please enter the passphrase.', true);

    const startIndex = input.indexOf(ZW_MARK);
    const endIndex = input.lastIndexOf(ZW_MARK);

    if (startIndex === -1 || endIndex === -1 || startIndex === endIndex) {
      return showStatus('extractStatus', 'No zero-width hidden sequence found in input text.', true);
    }

    const zwSequence = input.substring(startIndex + 1, endIndex);
    let scrambledBits = [];

    for (const char of zwSequence) {
      if (char === ZW_ZERO) scrambledBits.push('0');
      if (char === ZW_ONE)  scrambledBits.push('1');
    }

    if (scrambledBits.length === 0 || scrambledBits.length % 8 !== 0) {
      return showStatus('extractStatus', 'Corrupted or incomplete zero-width payload.', true);
    }

    const originalBits = unscrambleBits(scrambledBits, key);
    const binaryPayload = originalBits.join('');

    const encryptedText = binaryToText(binaryPayload);
    const decryptedText = xorCipher(encryptedText, key);

    secretEl.value = decryptedText;
    secretEl.classList.add('revealed');

    updateInspector(input);
    showStatus('extractStatus', 'Hidden payload extracted and decrypted successfully!');
  }

  function updateInspector(text) {
    let hexDisplay = [];
    let hiddenBitLength = 0;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (char === ZW_ZERO) {
        hexDisplay.push('E2808B[0]');
        hiddenBitLength++;
      } else if (char === ZW_ONE) {
        hexDisplay.push('E2808C[1]');
        hiddenBitLength++;
      } else if (char === ZW_MARK) {
        hexDisplay.push('E2808D[MARK]');
      }
    }

    const inspectorEl = document.getElementById('byteInspector');
    if (hexDisplay.length > 0) {
      inspectorEl.innerText = `Detected ${hiddenBitLength} hidden PRNG-scrambled bits embedded after char 1:\n` + hexDisplay.join(' ');
    } else {
      inspectorEl.innerText = 'No hidden zero-width bytes detected in current string.';
    }

    const statsEl = document.getElementById('embedCharStats');
    if (statsEl) statsEl.innerText = `${text.length} chars (${hiddenBitLength} hidden bits)`;
  }

  function copyOutput(elementId) {
    const output = document.getElementById(elementId);
    if (!output.value) return showStatus('embedStatus', 'Nothing to copy!', true);

    output.focus();
    output.select();
    output.setSelectionRange(0, 99999);

    try {
      const successful = document.execCommand('copy');
      if (successful) {
        showStatus('embedStatus', 'Copied full string (including zero-width bytes) to clipboard!');
      } else {
        navigator.clipboard.writeText(output.value).then(() => {
          showStatus('embedStatus', 'Copied to clipboard!');
        });
      }
    } catch (err) {
      navigator.clipboard.writeText(output.value).then(() => {
        showStatus('embedStatus', 'Copied to clipboard!');
      }).catch(() => {
        showStatus('embedStatus', 'Failed to copy text.', true);
      });
    }
  }

  function showStatus(elementId, msg, isError = false) {
    const el = document.getElementById(elementId);
    el.innerText = msg;
    el.className = 'status ' + (elementId === 'embedStatus' ? 'embed-status' : 'extract-status') + (isError ? ' error' : '');
    el.style.display = 'block';
  }
</script>
</body>
</html>
